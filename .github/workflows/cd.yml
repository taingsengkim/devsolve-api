name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  publish:
    # A manually dispatched CI has to be able to reach production too, or the
    # manual trigger is useless. Still excludes pull_request builds, which is
    # what this condition was always for.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.event == 'push'
              || github.event.workflow_run.event == 'workflow_dispatch') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # A GHCR namespace belongs to the repo owner, so a hard-coded image path
      # only publishes from the one repo it names. Deriving it lets the same
      # workflow run from either remote. Lowercased because GHCR rejects the
      # uppercase form of the org name.
      - name: Resolve image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    # The VPS pulls a private image, so this job has to hand it a registry
    # credential. Reading packages is all that takes.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # Log the VPS in with this job's own token rather than relying on a
      # credential placed by hand at setup time: that one expires silently and
      # the next deploy fails on "error from registry: unauthorized" with a
      # perfectly good image already published. Fed over stdin so the token
      # never appears in the VPS process list or on its disk, and dropped again
      # as soon as the pull is done.
      - name: Deploy to OVH VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e
             docker login ghcr.io -u '$REGISTRY_USER' --password-stdin
             trap 'docker logout ghcr.io' EXIT
             /home/ubuntu/istad/devsolve-api/deploy.sh '$IMAGE_TAG'"