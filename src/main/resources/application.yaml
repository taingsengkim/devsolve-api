spring:
  application:
    name: devsolve-api

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      # Hibernate owns the schema now that Flyway is gone. "update" only ever
      # adds tables and columns: it never drops, renames, or retypes, so any
      # of those has to be applied to the database by hand.
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    defer-datasource-initialization: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^^"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 200MB

  mvc:
    async:
      request-timeout: -1

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # Short on purpose. Nothing behind Redis here is worth stalling a request
      # for, so these are what keep an unreachable host a slowdown rather than
      # an outage.
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

  cache:
    type: redis
    redis:
      # Namespaced away from the rate-limit counters, which carry their own
      # devsolve:rl: prefix, so one Redis can hold both.
      key-prefix: "devsolve:cache:"
      use-key-prefix: true
      # Backstop only — each cache sets its own TTL in CacheConfig.
      time-to-live: ${REDIS_CACHE_TTL:5m}
      # Spring's NullValue sentinel cannot go through a serializer typed to the
      # cached class, and no cached method here returns null.
      cache-null-values: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

  # Left empty by default: with no host Spring Boot builds no JavaMailSender,
  # and SmtpMailService logs the mail it would have sent instead of failing.
  # Set MAIL_HOST to start actually delivering.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          # Without these an unreachable SMTP host hangs the sending thread
          # for as long as the OS lets it.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8999

minio:
  url: ${MINIO_URL}
  # Browser-reachable base URL for objects under the public/ prefix. Left
  # blank it falls back to minio.url. Declared with an empty default rather
  # than ${MINIO_PUBLIC_URL:${MINIO_URL}} so the key resolves even where
  # MINIO_URL is set as a property instead of an environment variable.
  public-url: ${MINIO_PUBLIC_URL:}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  target-realm: ${KEYCLOAK_TARGET_REALM}

app:
  redis:
    # Whether Redis backs the shared rate-limit counters and the caches. On is
    # safe even with no server running — the counters degrade to per-instance
    # memory and log once. Off also switches @EnableCaching off, so @Cacheable
    # becomes a plain method call rather than an unconfigured heap cache.
    enabled: ${REDIS_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    # Envelope sender. Defaults to the SMTP account, which is what most
    # providers require the From address to be anyway.
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:DevSolve}
  frontend:
    # Where emailed links land. The invitation link is
    #   {base-url}{invitation-path}/{invitationToken}
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    invitation-path: ${FRONTEND_INVITATION_PATH:/invitations}
  meilisearch:
    # Backs GET /api/v1/search. Off by default: the indexes are derived from
    # PostgreSQL and rebuildable at any time, so a deployment with no
    # Meilisearch running is one without the search endpoint — which answers
    # 503 — rather than a broken one. Nothing else in the API depends on it.
    enabled: ${MEILISEARCH_ENABLED:false}
    #   API on the host            -> http://localhost:7700
    #   API inside the compose net -> http://devsolve-meilisearch:7700
    url: ${MEILISEARCH_URL:http://localhost:7700}
    # The master key, or any key allowed to write documents and settings.
    api-key: ${MEILISEARCH_API_KEY:}
    # Prepended to every index name, so one Meilisearch can serve staging and
    # production without either reindexing over the other.
    index-prefix: ${MEILISEARCH_INDEX_PREFIX:}
    connect-timeout: ${MEILISEARCH_CONNECT_TIMEOUT:2s}
    read-timeout: ${MEILISEARCH_READ_TIMEOUT:10s}
    batch-size: ${MEILISEARCH_BATCH_SIZE:200}
    # How long a newly published program can take to become findable. There is
    # no write-path hook — the indexer polls updated_at — so this is the whole
    # staleness budget.
    sync-interval: ${MEILISEARCH_SYNC_INTERVAL:30s}
    sync-initial-delay: ${MEILISEARCH_SYNC_INITIAL_DELAY:15s}
    # How far back each pass re-reads. Covers a transaction that stamps a row
    # and commits after the pass that already read past it; without it that row
    # would never be indexed. Re-reading is free because writes are keyed by id.
    sync-overlap: ${MEILISEARCH_SYNC_OVERLAP:30s}
  claude:
    # Backs POST /api/v1/problems/duplicate-check, which reads a problem draft
    # against what is already published and says which existing problems would
    # answer it. Off by default: the endpoint still answers with plain keyword
    # matches and reports aiReviewed=false, so a deployment without a key is one
    # with a weaker duplicate check rather than a broken endpoint.
    #
    # This is the only path in the API that costs money per request. It is rate
    # limited per account and its verdicts are cached in Redis for an hour.
    enabled: ${CLAUDE_ENABLED:false}
    api-key: ${CLAUDE_API_KEY:}
    # Any model id the Messages API accepts. Deciding whether two differently
    # worded bug reports are the same bug is exactly where a weaker model
    # returns confident nonsense, so this defaults to the flagship; one call
    # covers a whole draft rather than a keystroke.
    model: ${CLAUDE_MODEL:claude-opus-5}
    # Thinking tokens count against this, so it is not the size of the JSON that
    # comes back.
    max-tokens: ${CLAUDE_MAX_TOKENS:4096}
    # Somebody pressed a button and is watching a spinner. Give up and fall back
    # to keyword matches well before a browser would.
    timeout: ${CLAUDE_TIMEOUT:30s}
    max-retries: ${CLAUDE_MAX_RETRIES:1}
  virus-total:
    # VirusTotal scans are asynchronous. Submit a file or URL, then poll the
    # returned analysis id through this API's /api/v1/virus-total/analyses
    # endpoint. Keep disabled until a server-side key has been configured.
    enabled: ${VIRUSTOTAL_ENABLED:false}
    api-key: ${VIRUSTOTAL_API_KEY:}
    base-url: ${VIRUSTOTAL_BASE_URL:https://www.virustotal.com/api/v3}
    # Upper bound on a single wait between polls, not a flat one: the first
    # check happens at a quarter of it, the next at a half, the rest at the
    # full value.
    #
    # For a file this budget is spent on a background thread after the upload
    # has been answered, so it is free to be long -- raising it costs a user
    # nothing. It used to be spent in front of the uploader, which is why an
    # upload sat for 95 seconds and was then refused with a 504 by a proxy
    # that cuts a request at 60. Only URLs still wait in line, and those come
    # back in seconds.
    poll-interval: ${VIRUSTOTAL_POLL_INTERVAL:20s}
    max-polls: ${VIRUSTOTAL_MAX_POLLS:6}
    # Whether an upload proceeds when VirusTotal will not take the submission
    # at all -- unreachable, or out of quota -- meaning nothing was scanned
    # and nothing was queued to scan it later. Content VirusTotal already
    # knows to be MALICIOUS or SUSPICIOUS is rejected regardless, before a
    # byte is stored, and that is the check that catches malware.
    #
    # Off: content nothing could be learned about is not stored. On: it is.
    # Turn it on only to keep uploads working through a VirusTotal outage,
    # and turn it back off after.
    fail-open: ${VIRUSTOTAL_FAIL_OPEN:false}
logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
