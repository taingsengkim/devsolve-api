minio:
  url: https://file.quizzy.it.com/
  access-key: ${MN_ACCESS_KEY}
  secret-key: ${MN_SECRET_KEY}
  bucket: products
spring:
  application:
    name: devsolve-api
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.quizzy.it.com/realms/devsolve
server:
  port: 8999
keycloak:
  server-url: https://auth.quizzy.it.com/
  realm: devsolve
  client-id: devsolve-admin
  client-secret: idh56ELtGEuuUVGVSeIWoRw2F8Ul5H5M
  target-realm: devsolve