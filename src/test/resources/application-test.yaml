spring:
  datasource:
    url: jdbc:h2:mem:devsolve;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-issuer
          jwk-set-uri: http://localhost:9999/test-jwks

minio:
  url: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-bucket

keycloak:
  server-url: http://localhost:8080
  realm: test-realm
  client-id: test-client
  client-secret: test-secret
  target-realm: test-realm
