spring:
  datasource:
    # The INIT clause creates the PostgreSQL enum types the entities name
    # through columnDefinition. H2 has no CREATE TYPE ... AS ENUM, so without
    # these Hibernate's create-drop silently fails on every table using one —
    # user_profiles and categories — and a repository test touching them dies
    # with "table not found" that looks like a bug in the query under test.
    #
    # It lives in the JDBC URL rather than a schema script on purpose. This
    # profile is shared with the Testcontainers tests, which point at real
    # PostgreSQL through @ServiceConnection and run the production schema.sql;
    # anything H2-specific put in spring.sql.init would be executed against
    # PostgreSQL there and fail. A URL only applies to the datasource that
    # actually uses it.
    url: 'jdbc:h2:mem:devsolve;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS membership_status_enum AS VARCHAR(50)\;CREATE DOMAIN IF NOT EXISTS category_scope_enum AS VARCHAR(50)'
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      # Off by default. The Testcontainers tests turn it back on per class so
      # they get the production schema.sql, which is the point of running them
      # against real PostgreSQL — so schema-locations must stay at its default.
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-issuer
          jwk-set-uri: http://localhost:9999/test-jwks

minio:
  url: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-bucket

keycloak:
  server-url: http://localhost:8080
  realm: test-realm
  client-id: test-client
  client-secret: test-secret
  target-realm: test-realm
