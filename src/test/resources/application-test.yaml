spring:
  datasource:
    # The INIT clause creates the PostgreSQL enum types the entities name
    # through columnDefinition — see h2-domains.sql for why they are needed and
    # why they live on the URL rather than in spring.sql.init.
    #
    # The list outgrew a URL once it had to cover reports, programs and
    # recognitions as well as user_profiles and categories, so it is a script
    # H2 runs through INIT rather than a chain of escaped statements.
    url: 'jdbc:h2:mem:devsolve;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM ''classpath:h2-domains.sql'''
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      # Off by default. The Testcontainers tests turn it back on per class so
      # they get the production schema.sql, which is the point of running them
      # against real PostgreSQL — so schema-locations must stay at its default.
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-issuer
          jwk-set-uri: http://localhost:9999/test-jwks

app:
  # No suite needs a Redis server. Off rather than left on and unreachable, so
  # tests exercise one deterministic path instead of whatever a connection
  # timeout happens to produce.
  redis:
    enabled: false

minio:
  url: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-bucket

keycloak:
  server-url: http://localhost:8080
  realm: test-realm
  client-id: test-client
  client-secret: test-secret
  target-realm: test-realm
