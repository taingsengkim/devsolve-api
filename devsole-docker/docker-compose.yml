volumes:
  devsolve-db-vol:
  devsolve-kc-vol:
  devsolve-minio-data:
networks:
  devsolve:
    external: true
services:
  devsolve-db:
    image: postgres:18.4
    container_name: devsolve-db
    ports:
      - "8989:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - devsolve-db-vol:/var/lib/postgresql/18/docker
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - devsolve
    restart: unless-stopped
