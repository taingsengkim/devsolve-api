  redis:
    image: redis:8.2-alpine
    container_name: devsolve-redis
    # No volume and no persistence: everything here is a cache entry or a
    # short-lived counter, all rebuildable from PostgreSQL. allkeys-lru for the
    # same reason — under memory pressure, drop old keys rather than refuse
    # writes and take the rate limiters down.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      # Localhost only: the API reaches Redis over the compose network, and it
      # has no business being open to the internet on a VPS.
      - "127.0.0.1:6379:6379"
    networks:
      - devsolve
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: devsolve-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      # Presigned download URLs are signed against the address clients use.
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - devsolve-minio-data:/data
    networks:
      - devsolve
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
